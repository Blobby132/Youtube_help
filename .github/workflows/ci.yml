name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    # Tests run on the newest Python only.
    name: Backend tests (Python 3.14)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install -r requirements.txt -r requirements-onnx-cpu.txt -r requirements-dev.txt
      - run: python -m pip install --no-deps -r requirements-no-deps.txt
      - name: Cache the models
        uses: actions/cache@v4
        with:
          path: |
            models/kokoro
            models/whisper
          key: models-${{ hashFiles('backend/app/voiceover/assets.py', 'backend/app/captions/assets.py') }}
      - name: Download the models
        run: |
          python -m app.voiceover.assets
          python -m app.captions.assets
      - run: python -m pytest
      - name: Upload pronunciation samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pronunciation-samples
          path: backend/tests/output/
          if-no-files-found: ignore

  frontend:
    name: Frontend lint, tests, build and end-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Chromium for the end-to-end tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  render:
    # Renders a project with the real backend and FFmpeg and compares the MP4 with the preview.
    name: Render end-to-end (FFmpeg, Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install the backend
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt -r requirements-onnx-cpu.txt
          python -m pip install --no-deps -r requirements-no-deps.txt
      - run: npm ci
        working-directory: frontend
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:render
        working-directory: frontend
        env:
          RENDER_E2E_PYTHON: python
      - name: Upload the frames
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-frames
          path: frontend/test-results/
          if-no-files-found: ignore
