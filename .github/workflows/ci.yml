name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    # Tests run on the newest Python only.
    name: Backend tests (Python 3.14)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install -r requirements.txt -r requirements-onnx-cpu.txt -r requirements-dev.txt
      - name: Cache the Kokoro model
        uses: actions/cache@v4
        with:
          path: models/kokoro
          key: kokoro-v1.0-${{ hashFiles('backend/app/voiceover/assets.py') }}
      - name: Download the Kokoro model
        run: python -m app.voiceover.assets
      - run: python -m pytest
      - name: Upload pronunciation samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pronunciation-samples
          path: backend/tests/output/
          if-no-files-found: ignore

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
